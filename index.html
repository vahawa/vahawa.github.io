<!DOCTYPE html><html lang="de"><head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.transitous.org; img-src data:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f2f4" media="(prefers-color-scheme: light)">
  <title>BVG Express</title>
  <link rel="apple-touch-icon" id="appIcon">

  <style>
    :root{
      --bg:#f2f2f4; --card:#ffffff; --border:#d8d8dc;
      --text:#1a1a1e; --muted:#6b6b73;
      --ok:#16a34a; --err:#e11d48; --accent:#0284c7; --warn:#b45309;
      --bvg:#F0D722; --bvg-text:#1a1a1e;
      --ok-border:rgba(22,163,74,.3); --err-border:rgba(225,29,72,.3); --accent-border:rgba(2,132,199,.3);
      --card-overlay:rgba(0,0,0,0.03);
      --r:14px;
      --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    @media(prefers-color-scheme:dark){
      :root{
        --bg:#0b0b0c; --card:#141417; --border:#26262b;
        --text:#f2f2f4; --muted:#a7a7ad;
        --ok:#86efac; --err:#fb7185; --accent:#7dd3fc; --warn:#fcd34d;
        --ok-border:rgba(134,239,172,.35); --err-border:rgba(251,113,133,.35); --accent-border:rgba(125,211,252,.35);
        --card-overlay:rgba(255,255,255,0.03);
      }
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
      padding: calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 14px);
      -webkit-font-smoothing: antialiased;
    }
    header{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:10px;}
    h1{margin:0; font-size:18px; display:flex; align-items:center; gap:8px}
    h1::before{content:""; width:11px; height:11px; border-radius:3px; background:var(--bvg); flex:none}
    .sub{margin-top:4px; font-size:12px; color:var(--muted); line-height:1.25}
    .btns{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end}
    button{
      background:var(--card); border:1px solid var(--border); color:var(--text);
      padding:10px 12px; border-radius:12px; font-size:13px; line-height:1; min-width:44px;
      cursor:pointer;
    }
    button:active{transform:translateY(1px)}
    button:focus-visible{outline:2px solid var(--bvg); outline-offset:2px}
    button.active{background:var(--bvg); border-color:var(--bvg); color:var(--bvg-text); font-weight:600}
    .info-btn{padding:10px; min-width:40px; font-size:15px; font-weight:700; line-height:1}
    .overlay{
      position:fixed; inset:0; z-index:100;
      background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center;
      padding:20px;
    }
    .overlay-box{
      background:var(--card); border:1px solid var(--border); border-radius:var(--r);
      padding:20px; max-width:340px; width:100%; font-size:14px; line-height:1.5;
    }
    .overlay-box h2{margin:0 0 10px; font-size:16px}
    .overlay-box p{margin:0 0 12px; color:var(--muted)}
    .overlay-box a{color:var(--accent)}
    .overlay-box strong{color:var(--text)}
    .overlay-box .close-btn{
      width:100%; margin-top:4px; padding:12px; border-radius:12px;
      font-size:14px; font-weight:600;
    }
    .choice-grid{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 4px}
    .choice-grid button{
      flex:1 1 auto; min-width:60px; padding:12px 10px; border-radius:12px;
      font-size:15px; font-weight:600; text-align:center;
    }
    .choice-grid button.selected{background:var(--bvg); border-color:var(--bvg); color:var(--bvg-text)}
    .pill{
      display:flex; align-items:center; gap:8px;
      border:1px solid var(--border);
      background:var(--card-overlay);
      padding:8px 10px; border-radius:999px;
      font-size:12px; color:var(--muted);
      margin: 8px 0 12px;
    }
    .dot{width:8px; height:8px; border-radius:999px; background:var(--muted)}
    .dot.ok{background:var(--ok)}
    .dot.err{background:var(--err)}
    .status{
      background:var(--card-overlay);
      border:1px solid var(--border);
      border-radius:var(--r);
      padding:12px 12px;
      color:var(--muted);
      font-size:13px;
      line-height:1.35;
      margin-bottom:10px;
    }
    .grid{display:grid; gap:10px}
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--r);
      padding:12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .dep-left{flex:1; min-width:0; display:grid; gap:6px}
    .stop-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--r);
      padding:14px 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      transition:border-color .15s;
      width:100%; text-align:left; font:inherit; color:inherit;
    }
    .stop-card:active{border-color:var(--bvg)}
    .stop-name{font-size:15px; font-weight:600}
    .stop-dist{font-size:13px; color:var(--muted); white-space:nowrap}
    .stop-arrow{color:var(--muted); font-size:16px}
    .route{display:flex; gap:9px; align-items:center; min-width:0}
    .chip{
      font-size:13px; font-weight:700; line-height:1;
      padding:5px 8px; border-radius:6px;
      white-space:nowrap; flex:none;
      min-width:30px; text-align:center;
    }
    .dir{
      color:var(--text); font-size:14px; font-weight:600; line-height:1.3;
      overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    }
    .meta{
      display:flex; flex-wrap:wrap; gap:3px 10px;
      color:var(--muted);
      font-size:12px;
      font-variant-numeric:tabular-nums;
    }
    .meta .ok{color:var(--ok)}
    .meta .warn{color:var(--warn)}
    .when{text-align:right; flex:none}
    .rel{
      font-size:20px; font-weight:700; line-height:1.1;
      font-variant-numeric:tabular-nums; white-space:nowrap;
    }
    .rel.cancelled{font-size:14px; color:var(--err)}
    .mono{font-family:var(--mono)}
  </style>
</head>

<body>
  <header>
    <div>
      <h1>BVG Express</h1>
      <div class="sub" id="subtitle">Standort abrufen…</div>
    </div>
    <div class="btns">
      <button id="btnInfo" class="info-btn" title="Info">ⓘ</button>
      <button id="btnRefresh" title="Aktualisieren">↻</button>
      <button id="btnStop" title="Haltestelle wählen">Haltestelle</button>
      <button id="btnRadius" title="Radius ändern"></button>
      <button id="btnCount" title="Anzahl Abfahrten ändern"></button>
    </div>
  </header>

  <div class="pill">
    <span class="dot" id="dot"></span>
    <span id="pillText">Bereit</span>
  </div>

  <div class="grid" id="list" aria-live="polite"></div>

<script>
(() => {
  const API_BASE = "https://api.transitous.org/api/v1";
  const TZ = "Europe/Berlin";
  const STORAGE_KEY = "bvg_settings";
  const AUTO_REFRESH_MS = 30_000;

  const subtitle = document.getElementById("subtitle");
  const statusEl = document.getElementById("pillText");
  const listEl = document.getElementById("list");
  const dotEl = document.getElementById("dot");
  const btnStop = document.getElementById("btnStop");

  const RADIUS_OPTIONS = [100, 200, 500, 1000, 2000];
  const COUNT_OPTIONS = [5, 10, 20];

  const defaults = {
    radius_m: 500,
    max_results: 10,
    nearby_limit: 18,
    dep_results_per_stop: 10,
    dep_duration_min: 90,
    loc_timeout_ms: 10000,
    req_timeout_ms: 10000,
  };

  const state = { ...defaults, ...loadSettings() };
  let refreshTimer = null;
  let cachedStops = [];
  let lastNearby = null; // {lat, lon, radius_m} des letzten /map/stops-Abrufs
  let filterStop = null;
  let viewMode = "departures"; // "departures" | "stops"
  let loadRequestId = 0;

  // Nur bekannte Keys mit erlaubten Werten übernehmen — localStorage ist
  // nicht vertrauenswürdig (alte Versionen, manuelle Änderungen)
  function loadSettings() {
    try {
      const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (typeof parsed !== "object" || parsed === null) return {};
      const out = {};
      if (RADIUS_OPTIONS.includes(parsed.radius_m)) out.radius_m = parsed.radius_m;
      if (COUNT_OPTIONS.includes(parsed.max_results)) out.max_results = parsed.max_results;
      return out;
    } catch { return {}; }
  }

  function saveSettings() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        radius_m: state.radius_m,
        max_results: state.max_results,
      }));
    } catch {}
  }

  function scheduleRefresh() {
    clearTimeout(refreshTimer);
    if (viewMode === "departures") {
      refreshTimer = setTimeout(loadDepartures, AUTO_REFRESH_MS);
    }
  }

  const btnRadius = document.getElementById("btnRadius");
  const btnCount = document.getElementById("btnCount");

  function updateSettingsButtons() {
    btnRadius.textContent = `${state.radius_m} m`;
    btnCount.textContent = `${state.max_results} Abf.`;
  }

  function updateStopButton() {
    if (filterStop) {
      btnStop.textContent = filterStop.name;
      btnStop.classList.add("active");
    } else {
      btnStop.textContent = "Haltestelle";
      btnStop.classList.remove("active");
    }
  }

  function setPill(kind, text){
    dotEl.className = "dot" + (kind ? (" " + kind) : "");
    statusEl.textContent = text;
  }

  function fmtDistance(m){
    if (m == null) return "";
    const n = Number(m);
    if (!isFinite(n)) return "";
    if (n < 1000) return `${Math.round(n)} m`;
    return `${(n/1000).toFixed(1)} km`;
  }

  function isoToLocalTime(iso){
    const d = new Date(iso);
    return new Intl.DateTimeFormat("de-DE", {
      timeZone: TZ,
      hour: "2-digit",
      minute: "2-digit"
    }).format(d);
  }

  function fmtTime(){
    return new Intl.DateTimeFormat("de-DE", {
      timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit"
    }).format(new Date());
  }

  function nowISO(){
    return new Date().toISOString();
  }

  async function fetchJSON(url, params){
    const u = new URL(url);
    Object.entries(params || {}).forEach(([k,v]) => u.searchParams.set(k, String(v)));
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), state.req_timeout_ms);
    try{
      const res = await fetch(u.toString(), {
        signal: controller.signal,
        headers: { "accept": "application/json" }
      });
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } finally {
      clearTimeout(t);
    }
  }

  function distanceM(lat1, lon1, lat2, lon2){
    const R = 6371000, toRad = (x) => x * Math.PI / 180;
    const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  // map/stops liefert Bahnsteig-Ebene; auf VBB-Stationen gruppieren (key = Stations-Teil
  // der ID), DELFI-Duplikate verwerfen. Als Query-ID dient die echte Bahnsteig-ID des
  // nächstgelegenen Eintrags — die abgeleitete Stations-ID existiert nicht immer als Stop.
  function parseNearbyStops(payload, loc){
    const items = Array.isArray(payload) ? payload : [];
    const byStation = new Map();
    for(const it of items){
      if(!it || typeof it !== "object") continue;
      const m = String(it.stopId || "").match(/^(de-VBB_de:\d+:\d+)/);
      if(!m || !it.name) continue;
      const dist = Math.round(distanceM(loc.lat, loc.lon, Number(it.lat), Number(it.lon)));
      if(!isFinite(dist) || dist > state.radius_m) continue;
      const prev = byStation.get(m[1]);
      if(!prev || dist < prev.distance){
        byStation.set(m[1], { id: String(it.stopId), key: m[1], name: String(it.name), distance: dist });
      }
    }
    const out = [...byStation.values()];
    out.sort((a,b) => a.distance - b.distance);
    return out.slice(0, state.nearby_limit);
  }

  // GTFS-Linienfarben aus der API; Fallback nach Verkehrsmittel, falls der Feed
  // keine Farbe liefert (VBB liefert sie i.d.R.). MOTIS meldet S-Bahn als METRO.
  const MODE_COLORS = {
    SUBWAY: "#115D91", METRO: "#008351", TRAM: "#BE1414",
    BUS: "#95276E", REGIONAL_RAIL: "#E3000F", RAIL: "#E3000F", FERRY: "#0080BF",
  };

  function gtfsColor(c){
    return /^[0-9a-fA-F]{6}$/.test(String(c || "")) ? `#${c}` : null;
  }

  // onlyThisStop: stoptimes expandiert auf die ganze Station (teils Nachbar-Stops im
  // selben Cluster) — im Haltestellenfilter-Modus auf die gewählte Station einschränken
  function parseDepartures(payload, stop, nowMillis, onlyThisStop){
    const deps = payload?.stopTimes || [];
    const horizon = nowMillis + state.dep_duration_min * 60_000;
    const rows = [];
    for(const d of (deps || [])){
      if(!d || typeof d !== "object" || !d.place) continue;
      const p = d.place;
      if(onlyThisStop && stop.key && !String(p.stopId || "").startsWith(stop.key)) continue;

      const dt = new Date(p.departure || p.scheduledDeparture || NaN);
      if (Number.isNaN(dt.getTime())) continue;
      if (dt.getTime() < nowMillis || dt.getTime() > horizon) continue;

      // delay nur mit Echtzeitdaten — ohne realTime keine Aussage ("pünktlich" wäre gelogen)
      let delayMin = null;
      if (d.realTime && p.scheduledDeparture) {
        const sched = new Date(p.scheduledDeparture);
        if (!Number.isNaN(sched.getTime())) delayMin = Math.round((dt.getTime() - sched.getTime())/60000);
      }
      const delayTxt = delayMin == null ? null
        : delayMin === 0 ? "pünktlich"
        : delayMin > 0 ? `+${delayMin} min` : `${delayMin} min`;

      rows.push({
        when_dt: dt,
        time: isoToLocalTime(dt.toISOString()),
        delay: delayTxt,
        delay_min: delayMin,
        route: String(d.routeShortName || d.displayName || ""),
        route_color: gtfsColor(d.routeColor) || MODE_COLORS[String(d.mode || "")] || "#6b6b73",
        route_text_color: gtfsColor(d.routeTextColor) || "#ffffff",
        headsign: String(d.headsign || ""),
        platform: String(p.track || p.scheduledTrack || ""),
        stop_id: stop.id,
        stop_name: stop.name,
        distance_m: stop.distance,
        is_cancelled: Boolean(d.cancelled || d.tripCancelled),
        trip_id: d.tripId || null,
      });
    }
    return rows;
  }

  function dedupSort(rows, limit){
    rows.sort((a,b) => (a.when_dt - b.when_dt) || (a.distance_m - b.distance_m));
    const seen = new Set();
    const out = [];
    for(const r of rows){
      const key = r.trip_id
        ? r.trip_id
        : [r.when_dt.getTime(), r.route, r.headsign].join("|");
      if(seen.has(key)) continue;
      seen.add(key);
      out.push(r);
      if(out.length >= limit) break;
    }
    return out;
  }

  function clearList(){
    while(listEl.firstChild) listEl.removeChild(listEl.firstChild);
  }

  function relTimeText(depMillis){
    const min = Math.floor((depMillis - Date.now()) / 60000);
    return min <= 0 ? "jetzt" : `${min} min`;
  }

  // aktualisiert nur die relativen Zeit-Labels, kein Re-Fetch
  function updateRelTimes(){
    for(const el of document.querySelectorAll("[data-dep]")){
      el.textContent = relTimeText(Number(el.dataset.dep));
    }
  }

  function renderDepartures(rows, showStop){
    clearList();

    if(!rows.length){
      const box = document.createElement("div");
      box.className = "status";
      box.textContent = "Keine Abfahrten gefunden.";
      listEl.appendChild(box);
      return;
    }

    for(const r of rows){
      const card = document.createElement("div");
      card.className = "card";

      const left = document.createElement("div");
      left.className = "dep-left";

      const routeRow = document.createElement("div");
      routeRow.className = "route";

      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = r.route || "—";
      chip.style.background = r.route_color;
      chip.style.color = r.route_text_color;

      const dir = document.createElement("div");
      dir.className = "dir";
      dir.textContent = r.headsign || "—";

      routeRow.appendChild(chip);
      routeRow.appendChild(dir);

      const meta = document.createElement("div");
      meta.className = "meta";

      const abs = document.createElement("span");
      abs.className = "mono";
      abs.textContent = r.time;
      meta.appendChild(abs);

      if(r.delay && !r.is_cancelled){
        const delay = document.createElement("span");
        delay.className = r.delay_min === 0 ? "ok" : "warn";
        delay.textContent = r.delay;
        meta.appendChild(delay);
      }

      if(r.platform){
        const plat = document.createElement("span");
        plat.textContent = `Gl. ${r.platform}`;
        meta.appendChild(plat);
      }

      if(showStop){
        const stopName = document.createElement("span");
        stopName.textContent = `${r.stop_name} · ${fmtDistance(r.distance_m)}`;
        meta.appendChild(stopName);
      }

      left.appendChild(routeRow);
      left.appendChild(meta);

      const when = document.createElement("div");
      when.className = "when";
      const rel = document.createElement("div");
      rel.className = "rel";
      if(r.is_cancelled){
        rel.classList.add("cancelled");
        rel.textContent = "Fällt aus";
      } else {
        rel.dataset.dep = String(r.when_dt.getTime());
        rel.textContent = relTimeText(r.when_dt.getTime());
      }
      when.appendChild(rel);

      card.appendChild(left);
      card.appendChild(when);
      listEl.appendChild(card);
    }
  }

  function renderStops(stops){
    clearList();
    viewMode = "stops";

    if(!stops.length){
      const box = document.createElement("div");
      box.className = "status";
      box.textContent = `Keine Haltestellen im Umkreis (${state.radius_m} m).`;
      listEl.appendChild(box);
      return;
    }

    // "Alle" option to clear filter
    const allCard = document.createElement("button");
    allCard.className = "stop-card";
    if (!filterStop) allCard.style.borderColor = "var(--bvg)";
    allCard.addEventListener("click", () => {
      filterStop = null;
      updateStopButton();
      loadDepartures();
    });
    const allLeft = document.createElement("div");
    const allName = document.createElement("div");
    allName.className = "stop-name";
    allName.textContent = "Alle Haltestellen";
    const allDist = document.createElement("div");
    allDist.className = "stop-dist";
    allDist.textContent = `${stops.length} Haltestellen`;
    allLeft.appendChild(allName);
    allLeft.appendChild(allDist);
    allCard.appendChild(allLeft);
    listEl.appendChild(allCard);

    for(const s of stops){
      const card = document.createElement("button");
      card.className = "stop-card";
      if (filterStop && filterStop.key === s.key) card.style.borderColor = "var(--bvg)";
      card.addEventListener("click", () => {
        filterStop = s;
        updateStopButton();
        loadDepartures();
      });

      const left = document.createElement("div");
      const name = document.createElement("div");
      name.className = "stop-name";
      name.textContent = s.name;
      const dist = document.createElement("div");
      dist.className = "stop-dist";
      dist.textContent = fmtDistance(s.distance);
      left.appendChild(name);
      left.appendChild(dist);

      const arrow = document.createElement("div");
      arrow.className = "stop-arrow";
      arrow.textContent = "›";

      card.appendChild(left);
      card.appendChild(arrow);
      listEl.appendChild(card);
    }
  }

  function getLocation(){
    return new Promise((resolve, reject) => {
      if(!navigator.geolocation) return reject(new Error("Geolocation nicht verfügbar."));
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({
          lat: pos.coords.latitude,
          lon: pos.coords.longitude,
          acc: pos.coords.accuracy
        }),
        (err) => reject(new Error(err.message || "Standort konnte nicht abgerufen werden.")),
        { enableHighAccuracy: true, timeout: state.loc_timeout_ms, maximumAge: 15000 }
      );
    });
  }

  async function loadDepartures(){
    clearTimeout(refreshTimer);
    const thisRequest = ++loadRequestId;
    viewMode = "departures";
    clearList();

    try{
      setPill("", "Standort wird abgerufen…");

      const loc = await getLocation();
      if (thisRequest !== loadRequestId) return;
      subtitle.textContent = `Standort ±${Math.round(loc.acc)} m · Transitous`;

      // Nearby-Stops nur neu abfragen, wenn kein Cache, Radius geändert oder
      // Standort deutlich bewegt — der Auto-Refresh lädt sonst nur stoptimes
      const moved = lastNearby
        ? distanceM(loc.lat, loc.lon, lastNearby.lat, lastNearby.lon)
        : Infinity;
      if (!cachedStops.length || !lastNearby
          || lastNearby.radius_m !== state.radius_m
          || moved > state.radius_m / 3) {
        // Radius als Bounding-Box, exakter Radius wird in parseNearbyStops gefiltert
        const dLat = state.radius_m / 111320;
        const dLon = state.radius_m / (111320 * Math.cos(loc.lat * Math.PI / 180));
        const nearbyParams = {
          min: `${(loc.lat - dLat).toFixed(6)},${(loc.lon - dLon).toFixed(6)}`,
          max: `${(loc.lat + dLat).toFixed(6)},${(loc.lon + dLon).toFixed(6)}`,
        };
        let nearbyPayload;
        for (let attempt = 0; ; attempt++) {
          try {
            nearbyPayload = await fetchJSON(`${API_BASE}/map/stops`, nearbyParams);
            break;
          } catch(e) {
            if (attempt >= 2) throw e;
            if (thisRequest !== loadRequestId) return;
            setPill("", `Erneuter Versuch (${attempt + 1}/2)…`);
          }
        }

        if (thisRequest !== loadRequestId) return;
        cachedStops = parseNearbyStops(nearbyPayload, loc);
        lastNearby = { lat: loc.lat, lon: loc.lon, radius_m: state.radius_m };
      }
      const nearby = cachedStops;

      const stopsToQuery = filterStop
        ? nearby.filter(s => s.key === filterStop.key)
        : nearby;

      if(!stopsToQuery.length){
        setPill("err", filterStop
          ? `${filterStop.name} nicht im Umkreis (${state.radius_m} m).`
          : "Keine Haltestellen im Umkreis gefunden.");
        renderDepartures([], !filterStop);
        scheduleRefresh();
        return;
      }

      const label = filterStop ? filterStop.name : `${stopsToQuery.length} Haltestellen`;
      setPill("", `Lade Abfahrten (${label})…`);

      const when = nowISO();
      const nowMillis = Date.now();

      let depErrors = 0;
      const perStop = await Promise.all(
        stopsToQuery.map(async (stop) => {
          try{
            const dep = await fetchJSON(`${API_BASE}/stoptimes`, {
              stopId: stop.id,
              time: when,
              // im Filter-Modus mehr holen: die Antwort enthält auch Nachbar-Stops
              // des Clusters, die anschließend rausgefiltert werden; ungefiltert
              // muss n auch bei nur einer Station max_results hergeben
              n: filterStop
                ? Math.max(state.max_results, state.dep_results_per_stop) * 3
                : Math.max(state.max_results, state.dep_results_per_stop),
            });
            return parseDepartures(dep, stop, nowMillis, Boolean(filterStop));
          } catch {
            depErrors++;
            return [];
          }
        })
      );

      if (thisRequest !== loadRequestId) return;

      if (depErrors === stopsToQuery.length) {
        setPill("err", "Abfahrten konnten nicht geladen werden.");
        clearList();
        scheduleRefresh();
        return;
      }

      const combined = perStop.flat();
      const rows = dedupSort(combined, state.max_results);

      if(!rows.length){
        setPill("err", "Keine Abfahrten gefunden.");
        renderDepartures([], !filterStop);
        scheduleRefresh();
        return;
      }

      const filterLabel = filterStop ? ` · ${filterStop.name}` : "";
      const errLabel = depErrors
        ? ` · ${depErrors} Station${depErrors > 1 ? "en" : ""} ohne Antwort`
        : "";
      setPill("ok", `${rows.length} Abfahrten${filterLabel} · ${fmtTime()}${errLabel}`);
      renderDepartures(rows, !filterStop);

    } catch(e){
      if (thisRequest !== loadRequestId) return;
      setPill("err", `Fehler: ${e?.message || e}`);
      clearList();
    } finally {
      if (thisRequest === loadRequestId) scheduleRefresh();
    }
  }

  function showStopPicker(){
    if (viewMode === "stops") {
      // already showing stops — go back to departures
      loadDepartures();
      return;
    }
    if (!cachedStops.length) {
      // no cached stops yet — need to load first
      loadDepartures();
      return;
    }
    clearTimeout(refreshTimer);
    ++loadRequestId; // invalidate any in-flight loadDepartures()
    setPill("", "Haltestelle auswählen");
    renderStops(cachedStops);
  }

  // Overlay mit Klick-außerhalb- und Escape-Schließen; Listener wird mit aufgeräumt
  function makeOverlay(){
    const ov = document.createElement("div");
    ov.className = "overlay";
    const close = () => { ov.remove(); document.removeEventListener("keydown", onKey); };
    const onKey = (e) => { if(e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    ov.addEventListener("click", (e) => { if(e.target === ov) close(); });
    ov.closeOverlay = close;
    return ov;
  }

  function showChoiceOverlay(title, options, currentValue, unit, onSelect){
    const ov = makeOverlay();
    const box = document.createElement("div");
    box.className = "overlay-box";
    const h = document.createElement("h2");
    h.textContent = title;
    box.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "choice-grid";
    for(const val of options){
      const btn = document.createElement("button");
      btn.textContent = unit ? `${val} ${unit}` : String(val);
      if(val === currentValue) btn.classList.add("selected");
      btn.addEventListener("click", () => { ov.closeOverlay(); onSelect(val); });
      grid.appendChild(btn);
    }
    box.appendChild(grid);
    const close = document.createElement("button");
    close.className = "close-btn";
    close.textContent = "Abbrechen";
    close.addEventListener("click", ov.closeOverlay);
    box.appendChild(close);
    ov.appendChild(box);
    document.body.appendChild(ov);
  }

  function changeRadius(){
    showChoiceOverlay("Radius", RADIUS_OPTIONS, state.radius_m, "m", (v) => {
      state.radius_m = v;
      saveSettings();
      updateSettingsButtons();
      loadDepartures();
    });
  }

  function changeCount(){
    showChoiceOverlay("Abfahrten", COUNT_OPTIONS, state.max_results, "", (v) => {
      state.max_results = v;
      saveSettings();
      updateSettingsButtons();
      if (viewMode === "departures") loadDepartures();
    });
  }

  document.getElementById("btnInfo").addEventListener("click", () => {
    const ov = makeOverlay();
    ov.innerHTML = `<div class="overlay-box">
      <h2>BVG Express</h2>
      <p>Ziel dieser Anwendung ist, auf dem schnellsten Weg die relevanten Abfahrten zu finden.</p>
      <p><strong>Als App speichern:</strong></p>
      <p><strong>iPhone:</strong> Im Safari auf <em>Teilen</em> (⬆) tippen → <em>Zum Home-Bildschirm</em> wählen.</p>
      <p><strong>Android:</strong> Im Chrome auf <em>Menü</em> (⋮) tippen → <em>Zum Startbildschirm hinzufügen</em> wählen.</p>
      <p><strong>Datenschutz:</strong> Dein Standort wird direkt an Transitous geschickt, einen community-betriebenen Open-Data-Dienst, um die nächsten Abfahrten abzurufen. Es gibt keinen Zwischenserver, keine Accounts, kein Tracking und keine Analyse. Deine Einstellungen bleiben lokal auf deinem Gerät.</p>
      <p><strong>Daten:</strong> <a href="https://transitous.org/sources/" target="_blank" rel="noopener">Transitous</a> (offene VBB-Fahrplandaten inkl. Echtzeit).</p>
      <button class="close-btn">Schließen</button>
    </div>`;
    ov.querySelector(".close-btn").addEventListener("click", ov.closeOverlay);
    document.body.appendChild(ov);
  });

  document.getElementById("btnRefresh").addEventListener("click", loadDepartures);
  btnStop.addEventListener("click", showStopPicker);
  document.getElementById("btnRadius").addEventListener("click", changeRadius);
  document.getElementById("btnCount").addEventListener("click", changeCount);

  // Aus dem Hintergrund geholt → sofort aktualisieren statt bis zu 30 s
  // alte Zeiten zu zeigen; im Hintergrund keine Requests
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      if (viewMode === "departures") loadDepartures();
    } else {
      clearTimeout(refreshTimer);
    }
  });

  setInterval(updateRelTimes, 10_000);

  updateStopButton();
  updateSettingsButtons();
  loadDepartures();
})();

// Generate app icon (BVG yellow + train/lightning pictogram)
(() => {
  const s = 180;
  const c = document.createElement("canvas");
  c.width = s; c.height = s;
  const x = c.getContext("2d");

  // BVG yellow background
  x.fillStyle = "#F0D722";
  x.fillRect(0, 0, s, s);

  // Train body (front view) - dark outline style
  const cx = 90, trainW = 80, trainH = 100;
  const tl = cx - trainW/2, tt = 28;

  // Main body
  x.fillStyle = "#1a1a1e";
  x.beginPath();
  x.moveTo(tl + 10, tt);
  x.lineTo(tl + trainW - 10, tt);
  x.quadraticCurveTo(tl + trainW, tt, tl + trainW, tt + 10);
  x.lineTo(tl + trainW, tt + trainH - 8);
  x.quadraticCurveTo(tl + trainW, tt + trainH, tl + trainW - 8, tt + trainH);
  x.lineTo(tl + 8, tt + trainH);
  x.quadraticCurveTo(tl, tt + trainH, tl, tt + trainH - 8);
  x.lineTo(tl, tt + 10);
  x.quadraticCurveTo(tl, tt, tl + 10, tt);
  x.fill();

  // Windshield
  x.fillStyle = "#F0D722";
  x.beginPath();
  x.roundRect(tl + 10, tt + 10, trainW - 20, 34, 6);
  x.fill();

  // Two side windows
  x.beginPath();
  x.roundRect(tl + 10, tt + 52, 22, 18, 3);
  x.fill();
  x.beginPath();
  x.roundRect(tl + trainW - 32, tt + 52, 22, 18, 3);
  x.fill();

  // Headlights
  x.fillStyle = "#F0D722";
  x.beginPath();
  x.arc(tl + 16, tt + trainH - 12, 6, 0, Math.PI * 2);
  x.fill();
  x.beginPath();
  x.arc(tl + trainW - 16, tt + trainH - 12, 6, 0, Math.PI * 2);
  x.fill();

  // Wheels / rail bar
  x.fillStyle = "#1a1a1e";
  x.beginPath();
  x.roundRect(tl - 2, tt + trainH + 4, trainW + 4, 8, 4);
  x.fill();

  // Lightning bolt - solid filled
  x.fillStyle = "#F0D722";
  x.lineJoin = "round";
  x.beginPath();
  x.moveTo(102, 22);
  x.lineTo(78, 88);
  x.lineTo(98, 88);
  x.lineTo(76, 158);
  x.lineTo(108, 96);
  x.lineTo(88, 96);
  x.lineTo(102, 22);
  x.closePath();
  x.fill();

  // Set as apple-touch-icon
  document.getElementById("appIcon").href = c.toDataURL("image/png");
})();
</script>
